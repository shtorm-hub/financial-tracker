<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Finance Tracker</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><script src="{{ url_for('static', filename='script.js') }}" defer></script></head>
<body data-page="{{ mode }}"><main class="auth-shell"><section class="glass-panel auth-card"><div class="auth-top"><a href="/login" class="logo">✦ Finance.</a><label class="sr-only" for="language">Language</label><select id="language" aria-label="Language" data-i18n-aria="languageLabel"><option value="en">EN</option><option value="ru">RU</option><option value="kk">ҚАЗ</option></select></div>
{% if mode == 'login' %}<h1 data-i18n="signIn">Welcome back</h1><p class="muted" data-i18n="signInHelp">Sign in to your personal finances.</p>{% else %}<h1 data-i18n="signUp">Create your account</h1><p class="muted" data-i18n="signUpHelp">Start tracking your finances today.</p>{% endif %}
<form id="auth-form" novalidate><label><span data-i18n="usernameLabel">Username</span><input name="username" minlength="3" maxlength="32" autocomplete="username" required></label><label for="password"><span data-i18n="passwordLabel">Password</span></label><div class="password-field"><input id="password" name="password" type="password" minlength="12" maxlength="256" autocomplete="{{ 'current-password' if mode == 'login' else 'new-password' }}" required><button type="button" id="toggle-password" aria-controls="password" aria-pressed="false" aria-label="Show password" data-i18n-aria="showPassword"><span aria-hidden="true">◉</span><span class="sr-only" data-i18n="showPassword">Show password</span></button></div><p id="auth-error" class="form-error" role="alert"></p><button class="primary-button" type="submit" data-i18n="{{ 'login' if mode == 'login' else 'register' }}">{{ 'Sign in' if mode == 'login' else 'Create account' }}</button></form>
{% if mode == 'login' %}<p class="auth-switch"><span data-i18n="noAccount">New here?</span> <a href="/register" data-i18n="register">Create account</a></p>{% else %}<p class="auth-switch"><span data-i18n="haveAccount">Already have an account?</span> <a href="/login" data-i18n="login">Sign in</a></p>{% endif %}</section></main></body></html>
